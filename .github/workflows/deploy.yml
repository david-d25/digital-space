# Build once, deploy that exact build.
#
# The image is the artifact: it is built here, tagged with the commit it came
# from, pushed to GHCR, and the server only pulls it.
#
# Rolling back is setting TAG to an older commit and running `up -d`.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  web:
    name: Build and publish web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type check
        working-directory: frontend
        run: npm ci && npx tsc --noEmit

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ vars.BASE_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: web
    runs-on: ubuntu-latest
    # Don't build if deploy host not specified
    if: ${{ vars.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authorise
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pinned when we are given one. Scanning on every run costs three
          # more connections to a port that is under constant brute-force
          # pressure, and it trusts whichever host happens to answer.
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY is not set; scanning the host key instead"
            ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts
          fi

          # Retries are here because sshd drops connections at random once its
          # pre-auth queue is full, which on a public IP it regularly is.
          cat >> ~/.ssh/config <<CONF
          Host deploy-target
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
          CONF

      # One connection for the whole deploy. It used to take four — a mkdir,
      # two copies and the restart — and each was another chance to be turned
      # away. The files travel through the same pipe as a tar stream.
      #
      # `.env` is not in the archive (it is not in git), so the server's own
      # copy survives; only its TAG line is rewritten.
      - name: Ship and restart
        env:
          DIR: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ github.sha }}
        run: |
          tar -C deployment -czf - . | ssh deploy-target "
            set -eu
            mkdir -p '$DIR'
            tar -C '$DIR' -xzf -
            cd '$DIR'
            touch .env
            sed -i '/^TAG=/d' .env
            echo 'TAG=$TAG' >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          "
